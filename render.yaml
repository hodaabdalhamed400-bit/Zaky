# Render Blueprint — ZAKI Smart ERP
# خدمة مستقلة تمامًا عن Smart Meet (اسم وقاعدة بيانات ونطاق منفصلة).
# راجع docs/DEPLOY_RENDER.md قبل النشر، خصوصًا قسم حماية البيانات.
services:
  - type: web
    name: zaki-erp
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    # قرص دائم خاص لملفات العقود والمستندات (لا يُخدم مباشرة؛ التنزيل عبر /api/documents بعد التحقق)
    disk:
      name: zaki-storage
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zaki-erp-db
          property: connectionString
      - key: SESSION_MAX_AGE_HOURS
        value: "12"
      - key: SESSION_IDLE_TIMEOUT_MINUTES
        value: "120"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: CRON_SECRET
        generateValue: true
      # مفتاح تشفير أسرار التحقق الثنائي — لا تغيّره بعد التشغيل (يُبطل التحقق الثنائي لكل المستخدمين)
      - key: MFA_ENCRYPTION_KEY
        generateValue: true

  # المهمة اليومية: انتهاء العقود + مسودات التجديد التلقائية (00:15 بتوقيت الرياض = 21:15 UTC)
  - type: cron
    name: zaki-erp-daily
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "15 21 * * *"
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npm run job:daily
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: DATABASE_URL
        fromDatabase:
          name: zaki-erp-db
          property: connectionString

databases:
  - name: zaki-erp-db
    databaseName: zaki_erp
    user: zaki_erp
    region: frankfurt
    plan: basic-1gb
    postgresMajorVersion: "16"
    ipAllowList: []
