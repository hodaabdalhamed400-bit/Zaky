# Render Blueprint — ZAKI Smart ERP
# خدمة مستقلة تمامًا عن Smart Meet (اسم وقاعدة بيانات ونطاق منفصلة).
# راجع docs/DEPLOY_RENDER.md قبل النشر، خصوصًا قسم حماية البيانات.
services:
  - type: web
    name: zaki-erp
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zaki-erp-db
          property: connectionString
      - key: SESSION_MAX_AGE_HOURS
        value: "12"
      - key: SESSION_IDLE_TIMEOUT_MINUTES
        value: "120"
      - key: TRUSTED_PROXY_HOPS
        value: "1"

databases:
  - name: zaki-erp-db
    databaseName: zaki_erp
    user: zaki_erp
    region: frankfurt
    plan: basic-1gb
    postgresMajorVersion: "16"
    ipAllowList: []
