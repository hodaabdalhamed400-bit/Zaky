services:
  - type: web
    name: smart-meet
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MAX_PARTICIPANTS
        value: "8"
      - key: DATA_DIR
        value: /var/data
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: VIP_CODE
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_PASSWORD
        sync: false
