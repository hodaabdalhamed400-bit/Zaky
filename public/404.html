<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <script src="/js/i18n.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>الصفحة مش موجودة | smart Meet</title>
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/home.css">
  <style>
    .nf { min-height: 70dvh; display: grid; place-items: center; text-align: center; padding: 20px 16px; }
    .nf-card { display: grid; gap: .8rem; justify-items: center; max-width: 440px; }
    .nf-code { font-size: clamp(4rem, 18vw, 7rem); font-weight: 700; line-height: 1; background: linear-gradient(135deg, #4fd1e0, #7c5cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nf h1 { margin: 0; font-size: 1.5rem; }
    .nf p { margin: 0; color: var(--muted); line-height: 1.8; }
    .nf a.go { margin-top: .6rem; padding: .85rem 1.6rem; border-radius: 16px; color: #fff; font-weight: 700; text-decoration: none; background: linear-gradient(135deg, #1faec1, #127f8e); box-shadow: 0 12px 30px rgba(31, 174, 193, .35); }
  </style>
</head>
<body class="hp legal">
  <div class="hp-bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="grid-lines"></span></div>
  <header class="hp-nav reveal" style="--d:0">
    <a href="/"><img src="/img/logo-light.png" alt="ذكي smart" class="hp-logo"></a>
    <span class="nav-right"><span data-lang-picker></span></span>
  </header>
  <main class="nf">
    <div class="nf-card reveal" style="--d:1">
      <div class="nf-code">404</div>
      <h1>الصفحة دي مش موجودة</h1>
      <p>ممكن الرابط يكون اتكتب غلط أو اتغيّر. لو كنت داخل اجتماع، اطلب الرابط تاني من منظّم الاجتماع.</p>
      <a class="go" href="/">← الرجوع للرئيسية</a>
    </div>
  </main>
</body>
</html>
