<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132e4d">
  <title>smart Meet | ذكي</title>
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home light">
  <main class="home-wrap">
    <div class="brand brand-lg" data-brand="light"></div>
    <h1>منصة اجتماعات ذكي</h1>
    <p class="muted">اجتماعات فيديو لفريق العمل ورواد الأعمال والشركاء — مع مساعد ذكي وترجمة فورية.</p>

    <section class="card">
      <label class="field">
        <span>اسمك</span>
        <input id="name" maxlength="40" placeholder="مثلاً: محمود عبد الحميد" autocomplete="name">
      </label>

      <label class="field">
        <span>عنوان الاجتماع (اختياري)</span>
        <input id="title" maxlength="80" placeholder="مثلاً: اجتماع المبيعات الأسبوعي">
      </label>
      <label class="field" id="accessField" hidden>
        <span>كود الشركة (للموظفين)</span>
        <input id="access" type="password" autocomplete="current-password" placeholder="••••••">
      </label>
      <button id="create" class="btn btn-primary btn-block"><span data-icon="plus"></span> اجتماع جديد</button>

      <div class="divider"><span>أو</span></div>

      <label class="field">
        <span>كود أو رابط الاجتماع</span>
        <input id="code" dir="ltr" placeholder="abc-defg-hij">
      </label>
      <button id="join" class="btn btn-ghost btn-block"><span data-icon="login"></span> انضمام</button>
      <p id="err" class="error" role="alert"></p>
    </section>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/icons.js"></script>
  <script>
    renderBrand(); hydrateIcons();
    const $ = (id) => document.getElementById(id);
    const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
    $('name').value = store.get('meet:name') || '';
    const saveName = () => { const n = $('name').value.trim(); if (n) store.set('meet:name', n); };

    // كود الشركة: بيظهر بس لو الخادم طالبه، والموبايل بيفتكره بعد أول مرة صح
    let needCode = false;
    fetch('/api/config').then((r) => r.json()).then((cfg) => {
      needCode = !!cfg.accessCode;
      $('accessField').hidden = !needCode || !!store.get('meet:access');
    }).catch(() => {});

    $('create').onclick = async () => {
      saveName();
      $('err').textContent = '';
      const code = $('access').value.trim() || store.get('meet:access') || '';
      if (needCode && !code) { $('accessField').hidden = false; $('err').textContent = 'اكتب كود الشركة علشان تعمل اجتماع جديد.'; $('access').focus(); return; }
      try {
        const r = await fetch('/api/new', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
        if (r.status === 401) {
          store.set('meet:access', '');
          $('accessField').hidden = false; $('access').value = ''; $('access').focus();
          $('err').textContent = 'كود الشركة غلط.';
          return;
        }
        if (r.status === 429) { $('err').textContent = 'محاولات غلط كتير — استنى ربع ساعة وحاول تاني.'; return; }
        const { id } = await r.json();
        if (needCode) store.set('meet:access', code);
        const t = $('title').value.trim();
        location.href = `/m/${id}${t ? `?t=${encodeURIComponent(t)}` : ''}`;
      } catch { $('err').textContent = 'تعذر إنشاء الاجتماع، حاول مرة أخرى.'; }
    };
    const join = () => {
      saveName();
      const raw = $('code').value.trim().toLowerCase();
      const m = raw.match(/([a-z0-9-]{3,40})\/?$/);
      if (!m) { $('err').textContent = 'اكتب كود اجتماع صحيح.'; return; }
      location.href = `/m/${m[1]}`;
    };
    $('join').onclick = join;
    $('code').addEventListener('keydown', (e) => e.key === 'Enter' && join());
  </script>
</body>
</html>
